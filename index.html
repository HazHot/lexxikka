<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Имени шизы Лексики</title>
    <link rel="icon" type="image/png" href="assets/icon.png">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Underdog&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Underdog', 'Calibri';
        }

        .home-theme #profile-block {
            border-color: #7c00ff;
        }

        .profile-container::after {
            background: radial-gradient(circle at 10px 10px,
                    var(--primary-color, #ab0c34) 23%,
                    transparent 15%);
        }

        body {
            background-color: #000;
            color: #fff;
            overflow: hidden;
        }

        .container {
            width: 100%;
            height: 100vh;
            position: relative;
        }

        #bg-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .bg-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: opacity 1.2s ease-in-out;
        }

        .hidden {
            display: none !important;
        }

        .volume-control {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .volume-icon {
            width: 20px;
            height: 20px;
            cursor: pointer;
            display: flex;
            color: white;
        }

        .slider {
            -webkit-appearance: none;
            appearance: none;
            width: 80px;
            height: 5px;
            border-radius: 5px;
            background: rgba(255, 255, 255, 0.3);
            outline: none;
        }

        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: white;
            cursor: pointer;
        }

        .bottom-controls {
            position: fixed;
            bottom: 6%;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            align-items: center;
            z-index: 20;
        }

        .voice-control-wrapper {
            position: relative;
            padding: 2px;
            background: linear-gradient(to right bottom, #2674df, #a61fd3);
            border-radius: 20px;
        }

        .voice-control {
            display: flex;
            align-items: center;
            gap: 15px;
            background: rgba(0, 0, 0, 0.7);
            padding: 8px 12px;
            border-radius: 20px;
            backdrop-filter: blur(5px);
        }

        #profile-block {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 820px;
            min-height: 332px;
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 20px;
            border-radius: 15px;
            z-index: 20;
            display: flex;
            flex-direction: column;
            gap: 15px;
            backdrop-filter: blur(10px);
            opacity: 0;
            transform-style: preserve-3d;
            pointer-events: auto;
        }

        .profile-header {
            display: flex;
            align-items: flex-start;
            gap: 15px;
        }

        .profile-container {
            position: relative;
            width: 200px;
            height: 200px;
        }

        .profile-container::after {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            border-radius: 50%;
            animation: orbit 3s linear infinite;
            z-index: -1;
            filter: blur(7px);
            box-shadow: none;
        }

        .profile-container.fast-orbit::after {
            animation: fast-orbit 0.5s linear forwards;
        }

        .profile-picture {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            object-fit: cover;
            cursor: pointer;
            pointer-events: auto;
            opacity: 1 !important;
        }

        .profile-info {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .name-and-badges {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            gap: 10px;
            margin-bottom: 10px;
        }

        #profile-name {
            font-size: 32px;
            font-weight: bold;
            letter-spacing: 3px;
            color: #fff;
            filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.7));
            opacity: 1 !important;
        }

        .badge-group {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .badge-container {
            position: relative;
            pointer-events: auto;
            opacity: 1 !important;
        }

        .badge-container .tooltip {
            visibility: hidden;
            width: 120px;
            background-color: rgba(0, 0, 0, 0.8);
            color: #fff;
            text-align: center;
            border-radius: 6px;
            padding: 5px 0;
            position: absolute;
            z-index: 100;
            bottom: 125%;
            left: 50%;
            margin-left: -60px;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .badge-container:hover .tooltip {
            visibility: visible;
            opacity: 1 !important;
        }

        .badge-box {
            background: rgba(255, 255, 255, 0.15);
            padding: 2px;
            border-radius: 15px;
            display: inline-block;
        }

        .badge-box-inner {
            background: rgba(0, 0, 0, 0.5);
            padding: 5px;
            border-radius: 12px;
            display: flex;
            gap: 8px;
            box-shadow: inset 0 0 10px rgba(255, 255, 255, 0.2);
        }

        .badge {
            width: 22px;
            height: 22px;
            transition: transform 0.3s;
            pointer-events: auto;
            opacity: 1 !important;
        }

        .badge:hover {
            transform: scale(1.2);
        }

        #profile-bio {
            color: rgba(255, 255, 255, 0.8);
            font-size: 18px;
            line-height: 1.5;
            margin-bottom: 10px;
            opacity: 1 !important;
        }

        .bio-separator {
            width: 100%;
            height: 1px;
            background: rgba(255, 255, 255, 0.2);
            margin: 20px 0;
            opacity: 1 !important;
        }

        .profile-footer {
            display: flex;
            flex-direction: column;
            gap: 5px;
            width: 100%;
            margin-top: auto;
        }

        .visitor-counter {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.1);
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 14px;
            align-self: flex-start;
            position: relative;
            pointer-events: auto;
            opacity: 1 !important;
            width: 110px;
        }

        .visitor-icon {
            width: 18px;
            height: 18px;
            color: white;
            opacity: 1 !important;
        }

        .visitor-counter .tooltip {
            visibility: hidden;
            width: 130px;
            background-color: rgba(0, 0, 0, 0.8);
            color: #fff;
            text-align: center;
            border-radius: 6px;
            padding: 5px 0;
            position: absolute;
            z-index: 100;
            top: -35px;
            left: 50%;
            margin-left: -63px;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .visitor-counter:hover .tooltip {
            visibility: visible;
            opacity: 1 !important;
        }

        #visitor-count {
            opacity: 1 !important;
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 0;
            pointer-events: auto;
            opacity: 1 !important;
        }

        .social-icon {
            width: 36px;
            height: 36px;
            transition: transform 0.3s ease;
            filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.7));
            pointer-events: auto;
            opacity: 1 !important;
        }

        .social-icon:hover {
            transform: scale(1.4) rotateY(15deg);
        }

        .glitch {
            animation: glitch 0.2s ease-in-out;
        }

        @keyframes glitch {
            0% {
                transform: translate(0);
            }

            20% {
                transform: translate(-2px, 2px);
            }

            40% {
                transform: translate(-2px, -2px);
            }

            60% {
                transform: translate(2px, 2px);
            }

            80% {
                transform: translate(2px, -2px);
            }

            100% {
                transform: translate(0);
            }
        }

        @keyframes orbit {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        @keyframes fast-orbit {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        #start-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 30;
            cursor: pointer;
        }

        #start-text {
            font-size: 24px;
            color: #fff;
            text-align: center;
        }

        /* --- КНОПКА ПЕРЕХОДА К ПЛЕЕРУ (С ОБЁРТКОЙ ДЛЯ ПОДСКАЗКИ) --- */
        .music-btn-wrapper {
            position: relative;
            display: inline-flex;
        }

        .music-btn-wrapper .music-loading-tooltip {
            position: absolute;
            bottom: calc(100% + 10px);
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.85);
            color: #fff;
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 14px;
            white-space: nowrap;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.2);
            z-index: 35;
        }

        .music-btn-wrapper .music-loading-tooltip::after {
            content: '';
            position: absolute;
            top: 100%;
            left: 50%;
            margin-left: -5px;
            border-width: 5px;
            border-style: solid;
            border-color: rgba(0, 0, 0, 0.85) transparent transparent transparent;
        }

        .music-btn-wrapper .music-loading-tooltip.visible {
            opacity: 1;
        }

        .more-music-btn {
            background: transparent;
            border: none;
            padding: 0;
            cursor: pointer;
            transition: transform 0.3s, opacity 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .more-music-btn img {
            width: 40px;
            height: 40px;
            object-fit: contain;
        }

        .more-music-btn:hover {
            transform: scale(1.1);
            opacity: 0.8;
        }

        /* --- ПАНЕЛЬ ПЛЕЕРА: ДВУХКОЛОНОЧНЫЙ LAYOUT --- */
        #music-player-panel {
            position: fixed;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%) translateY(150%);
            width: 500px;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 15px;
            padding: 20px;
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 25;
            border-color: #7c00ff;
        }

        #music-player-panel.slide-up {
            transform: translateX(-50%) translateY(0);
        }

        /* Левая часть: название, автор, громкость */
        .player-left {
            display: flex;
            flex-direction: column;
            gap: 12px;
            flex: 1;
            min-width: 0;
        }

        .track-info {
            text-align: left;
        }

        #track-title {
            font-size: 1.3em;
            font-weight: bold;
            color: #fff;
        }

        #track-artist {
            font-size: 1em;
            color: rgba(255, 255, 255, 0.7);
            margin-top: 5px;
        }

        /* Правая часть: кнопки управления */
        .player-right {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .player-controls {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .player-controls button {
            background: transparent;
            border: none;
            width: 45px;
            height: 45px;
            cursor: pointer;
            transition: transform 0.3s, opacity 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
        }

        .player-controls button img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .player-controls button:hover {
            transform: scale(1.1);
            opacity: 0.8;
        }

        .player-controls #play-pause-btn {
            width: 55px;
            height: 55px;
        }

        /* --- РЕГУЛИРОВКА ГРОМКОСТИ: ИСПРАВЛЕННОЕ ЦЕНТРИРОВАНИЕ --- */
        .player-volume {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .player-volume .volume-img {
            width: 22px;
            height: 22px;
            object-fit: contain;
            flex-shrink: 0;
        }

        .player-volume input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            width: 120px;
            height: 6px;
            border-radius: 3px;
            background: linear-gradient(to right, #6764f0, #da91e6);
            outline: none;
            cursor: pointer;
            margin: 0;
            padding: 0;
        }

        .player-volume input[type="range"]::-webkit-slider-runnable-track {
            height: 6px;
            border-radius: 3px;
        }

        .player-volume input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: white;
            cursor: pointer;
            margin-top: -5px;
            box-shadow: 0 0 4px rgba(255, 255, 255, 0.5);
        }

        .player-volume input[type="range"]::-moz-range-track {
            background: #9810f6;
            height: 6px;
            border-radius: 3px;
            border: none;
        }

        .player-volume input[type="range"]::-moz-range-thumb {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: white;
            cursor: pointer;
            border: none;
            box-shadow: 0 0 4px rgba(255, 255, 255, 0.5);
        }

        /* --- КНОПКА ВОЗВРАТА: ШИРИНА ПРОФИЛЯ, КОМПАКТНАЯ ВЫСОТА, ВНИЗУ --- */
        #back-btn {
            position: fixed;
            bottom: -15px;
            left: 50%;
            transform: translateX(-50%) translateY(150%);
            width: 820px;
            height: 50px;
            padding: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 15px;
            cursor: pointer;
            transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1), background 0.3s;
            z-index: 25;
            display: flex;
            align-items: start;
            justify-content: center;
            border-color: #7c00ff;
        }

        #back-btn.slide-up {
            transform: translateX(-50%) translateY(0);
        }

        #back-btn:hover {
            background: rgba(0, 0, 0, 0.9);
        }

        #back-btn img {
            width: 35px;
            height: 35px;
            object-fit: contain;
            transition: transform 0.3s, opacity 0.3s;
        }

        #back-btn:hover img {
            transform: scale(1.1);
            opacity: 0.8;
        }

        @media (max-width: 700px) {
            * {
                display: none;
            }
        }
    </style>
</head>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script>
        let profileAssetsLoaded = false;
        let musicAssetsLoaded = false;
        let totalProfileAssets = 0;
        let loadedProfileAssets = 0;
        let totalMusicAssets = 0;
        let loadedMusicAssets = 0;

        function initMedia() {
            const backgroundMusic = document.getElementById('background-music');

            profileBlock.addEventListener('touchend', () => { if (isMusicMode) return; gsap.to(profileBlock, { rotationX: 0, rotationY: 0, duration: 0.5, ease: 'power2.out' }); });

            profilePicture.addEventListener('click', () => {
                profileContainer.classList.remove('fast-orbit'); profileContainer.classList.remove('orbit');
                void profileContainer.offsetWidth; profileContainer.classList.add('fast-orbit');
                setTimeout(() => { profileContainer.classList.remove('fast-orbit'); void profileContainer.offsetWidth; profileContainer.classList.add('orbit'); }, 500);
            });
        });
    </script>
</body>

</html>
